apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-superset
spec:
  replicas: 1
  selector:
    matchLabels: {app: telemetry-superset}
  template:
    metadata:
      labels: {app: telemetry-superset}
    spec:
      containers:
        - name: superset
          image: automotive-telemetry-warehouse-superset:latest
          ports: [{containerPort: 8088}]
          envFrom:
            - secretRef: {name: telemetry-secrets}
          readinessProbe:
            httpGet: {path: /health, port: 8088}
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-superset
spec:
  type: NodePort
  selector: {app: telemetry-superset}
  ports: [{port: 8088, targetPort: 8088, nodePort: 30088}]
