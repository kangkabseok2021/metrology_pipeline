[project]
name = "automotive-telemetry-warehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-postgresql>=6.1",
    "httpx>=0.27",
    "ruff>=0.6,<0.14",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: requires a running PostgreSQL instance (provided by pytest-postgresql)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
