[project]
name = "analytics-pipeline-dq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6,<0.14",
    "great-expectations>=0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running PostgreSQL instance"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
