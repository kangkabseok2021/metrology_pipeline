[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrology-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "h5py>=3.10",
  "pydantic>=2.7",
  "opencv-python-headless>=4.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4"]
dev = ["jax[cpu]>=0.4", "pytest>=8", "pytest-benchmark>=4", "mypy>=1.10", "ruff>=0.4", "pydantic[mypy]>=2.7"]

[project.scripts]
leo-tracker = "leo_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metrology_pipeline", "src/leo_tracker"]

[tool.pytest.ini_options]
addopts = "--tb=short"
markers = [
  "benchmark: performance tests",
  "integration: requires HDF5 file on disk",
  "gpu: requires JAX GPU backend",
]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "ANN", "D"]
ignore = ["D203", "D213", "ANN101", "ANN102"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["h5py.*", "jax.*", "scipy.*", "cv2.*", "tqdm.*"]
ignore_missing_imports = true
