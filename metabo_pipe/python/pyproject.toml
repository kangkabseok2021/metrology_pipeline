[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metabopipe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyteomics>=4.7",
    "scipy>=1.12",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "pandas>=2.2",
    "lxml>=5.0",
    "psims>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["metabopipe"]
