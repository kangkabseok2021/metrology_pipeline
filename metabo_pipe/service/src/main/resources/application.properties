spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/metabopipe}
spring.datasource.username=${DB_USER:metabopipe}
spring.datasource.password=${DB_PASSWORD:metabopipe}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
