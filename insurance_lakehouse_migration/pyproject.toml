[project]
name = "insurance-lakehouse-migration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=26",
    "sqlalchemy>=2.0",
    "pymssql>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "chispa>=0.9",
    "ruff>=0.6,<0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker SQL Server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
