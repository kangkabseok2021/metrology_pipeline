name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --frozen
      - run: uv run mypy src/ --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --frozen
      - run: uv run pytest tests/ -v --tb=short -m "not benchmark and not gpu"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --frozen
      - run: uv run pytest tests/benchmarks/ -v --benchmark-json=benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build leo-tracker Docker image
        run: docker build -t leo-tracker:${{ github.sha }} .
      - name: Smoke-test import
        run: |
          docker run --rm --entrypoint python leo-tracker:${{ github.sha }} \
            -c 'from leo_tracker import PipelineOrchestrator; print("import ok")'

  dq-pipeline:
    name: Analytics DQ Pipeline — 7 offline pytest + dbt + GE Z-score gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics_pipeline_dq_engine

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       analytics
          POSTGRES_USER:     analytics
          POSTGRES_PASSWORD: analytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps (main + dev group)
        run: uv sync --group dev --no-install-project

      - name: ruff lint
        run: uv run ruff check .

      - name: Run offline tests (4 generation + 4 quality — no DB needed)
        run: uv run pytest tests/test_generation.py tests/test_quality.py -v --tb=short

      - name: Generate 5 000-row CSV
        run: uv run python generate_raw_data.py --rows 5000 --output /tmp/raw_shipments.csv

      - name: Load Bronze
        env:
          DATABASE_URL: postgresql://analytics:analytics@localhost:5432/analytics
        run: uv run python load_bronze.py --csv /tmp/raw_shipments.csv

      - name: dbt deps + run + test (Star Schema + dbt tests)
        env:
          DBT_HOST:     localhost
          DBT_USER:     analytics
          DBT_PASSWORD: analytics
          DBT_DBNAME:   analytics
        run: |
          uv run dbt deps  --project-dir dbt --profiles-dir dbt
          uv run dbt run   --project-dir dbt --profiles-dir dbt
          uv run dbt test  --project-dir dbt --profiles-dir dbt

      - name: Run DB tests (3 Bronze load tests)
        env:
          DATABASE_URL: postgresql://analytics:analytics@localhost:5432/analytics
        run: uv run pytest tests/test_load.py -v --tb=short

      - name: GE Z-score quality gate
        env:
          DATABASE_URL: postgresql://analytics:analytics@localhost:5432/analytics
        run: uv run python quality/checkpoint.py

  metabo-pipe-python:
    name: MetaboPipe — Python pytest (mzML + CWT + annotation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metabo_pipe/python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff lint
        run: uv run ruff check metabopipe/ tests/

      - name: pytest
        run: uv run pytest tests/ -v --tb=short

  metabo-pipe-r:
    name: MetaboPipe — R testthat (PCA / BH-FDR / volcano)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup R 4.4
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system libraries
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('metabo_pipe/stats/tests/test_stats.R') }}

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("readr","ggplot2","pheatmap","testthat"), repos="https://cloud.r-project.org", Ncpus=2)'
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install("mixOmics", ask=FALSE)'

      - name: Run testthat suite
        working-directory: metabo_pipe/stats
        run: Rscript -e 'testthat::test_dir("tests", reporter="progress", stop_on_failure=TRUE)'

  metabo-pipe-java:
    name: MetaboPipe — Java 21 / Spring Boot / Testcontainers JUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven test
        working-directory: metabo_pipe/service
        run: mvn test --batch-mode --no-transfer-progress

  telemetry-warehouse:
    name: Automotive Telemetry Warehouse — lint + offline + pytest-postgresql + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automotive_telemetry_warehouse

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps (main + dev group)
        run: uv sync --group dev --no-install-project

      - name: ruff lint
        run: uv run ruff check .

      - name: Offline tests (generation — no DB needed)
        run: uv run pytest tests/test_generation.py -v --tb=short -k "not docker_compose and not k8s"

      - name: pytest-postgresql suite (schema, load, endpoints, anomaly — ephemeral DB, no Docker)
        run: uv run pytest tests/test_schema.py tests/test_load.py tests/test_health.py tests/test_endpoints.py tests/test_anomaly.py -v --tb=short

      - name: Data-generation smoke test (1000-row dry run)
        run: uv run python scripts/generate_telemetry.py --rows 1000 --dry-run

      - name: docker compose config validation
        run: docker compose -f docker-compose.yml config --quiet

      - name: Kubernetes manifest YAML validation
        run: uv run pytest tests/test_generation.py::test_k8s_manifests_are_valid_yaml -v

      - name: Airflow DAG syntax check
        run: uv run pytest tests/test_generation.py::test_airflow_dag_compiles -v
